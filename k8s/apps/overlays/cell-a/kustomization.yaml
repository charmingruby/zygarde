# yaml-language-server: $schema=none
namespace: cell-a
namePrefix: cell-a-
labels:
  - pairs:
      app.kubernetes.io/instance: cell-a
      app.kubernetes.io/version: V1
    includeSelectors: true

resources:
  - ../../base
  - networking

configMapGenerator:
  - name: config
    literals:
      - PORT=4000
      - CELL_ID=a
      - IS_AVAILABLE=true
